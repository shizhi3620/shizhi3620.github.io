      description: "记录生活、工作与求职中的观察和实践。"
  en:
    label: "English"
    locale: "en-US"
    weight: 2
    contentDir: "content/en"
    title: "Jim's Notes"
    params:
      description: "Notes on life, work, and the journey of finding meaningful work."

params:
  author: "Jim"
  description: "记录生活、工作与求职中的观察和实践。"
  contactEmail: "shizhi3620@gmail.com"
  githubURL: "https://github.com/shizhi3620"

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

sitemap:
  changefreq: monthly
  priority: 0.5
  filename: sitemap.xml

markup:
