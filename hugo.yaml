title: "Jim's Notes"
defaultContentLanguage: zh
defaultContentLanguageInSubdir: true
enableRobotsTXT: true
hasCJKLanguage: true
summaryLength: 120

languages:
  zh:
    label: "中文"
    locale: "zh-CN"
    weight: 1
    contentDir: "content/zh"
    title: "路长的博客"
